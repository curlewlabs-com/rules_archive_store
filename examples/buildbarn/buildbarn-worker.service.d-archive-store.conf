# A drop-in for a Linux bb_worker unit: empty the archive store at each start
# and make it writable by the group every runner's action account shares
# (docs/executor.md). systemd turns $$ into $ before the shell sees it.
#
# The store is set aside and removed in the background, so a full store
# cannot hold the start past its timeout.
[Service]
ExecStartPre=/bin/sh -c 'if [ -e /var/lib/buildbarn-worker/archives ]; then mv /var/lib/buildbarn-worker/archives "$$(mktemp -d /var/lib/buildbarn-worker/archives.discarded.XXXXXX)/"; fi'
ExecStartPre=/usr/bin/install -d -m 2770 -g buildbarn-actions /var/lib/buildbarn-worker/archives
ExecStartPost=/bin/sh -c 'rm -rf /var/lib/buildbarn-worker/archives.discarded.* &'
ExecStopPost=/bin/rm -rf /var/lib/buildbarn-worker/archives
