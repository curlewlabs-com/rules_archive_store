name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.ref_name == 'main' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  integration-test:
    name: Integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Standard public-repository runners avoid metered larger runners. The
        # macOS one carries the case-insensitive APFS volume the conversion's
        # volume test and the linked trees need.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: false
          disk-cache: false
          repository-cache: false
          cache-save: false
      - name: Module suites
        run: bazel test //... --test_output=errors
      - name: Independent consumer
        working-directory: examples/consumer
        run: bazel test //... --test_output=errors
      - name: Verify a prepared release archive
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          python3 tools/prepare_release.py "$RELEASE_TAG" > "$notes"
          python3 - "$notes" <<'PYTHON'
          import json
          import sys
          from pathlib import Path

          version = json.loads(Path("dist/source.json").read_text())["version"]
          notice = Path("docs/release-notes") / f"{version}.md"
          if notice.is_file():
              prefix = notice.read_bytes().decode().rstrip() + "\n\n"
              if not Path(sys.argv[1]).read_bytes().decode().startswith(prefix):
                  raise SystemExit(f"generated release notes must open with {notice}")
          PYTHON

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mypy parses with the interpreter it runs under, and the evictor and a
      # test helper use Python 3.14's unparenthesized `except A, B`.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # renovate: datasource=python-version depName=python
          python-version: "3.14.10"
      - name: Install the pinned tools
        run: python -m pip install -r requirements-dev.txt
      - name: mypy (strict)
        run: mypy

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: false
          disk-cache: false
          repository-cache: false
          cache-save: false
      # The Bun the linked tree suite runs the helper under, so the check
      # needs no second Bun pin.
      - name: Put the suite's Bun on PATH
        run: |
          bazel build @test_bun//:bun
          bun="$(bazel info output_base)/$(bazel cquery @test_bun//:bun --output=files)"
          dirname "$bun" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - name: tsc --noEmit
        run: bun run typecheck
      - uses: curlewlabs-com/ci-baseline/typed@c737cbfb15dc18daffdcc34a2f01e114a389643f # v0.3.8

  baseline:
    # The checks every Curlew Labs repository runs, in one place:
    # https://github.com/curlewlabs-com/ci-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: curlewlabs-com/ci-baseline@c737cbfb15dc18daffdcc34a2f01e114a389643f # v0.3.8

  conclusion:
    needs: [integration-test, lint, typecheck, baseline]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Require every integration and lint job to pass
        env:
          INTEGRATION: ${{ needs.integration-test.result }}
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          BASELINE: ${{ needs.baseline.result }}
        run: test "$INTEGRATION" = success && test "$LINT" = success && test "$TYPECHECK" = success && test "$BASELINE" = success
